<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpMed - Cadastro de Médico</title>
  <link rel="stylesheet" href="cadastro.css" />
  <link rel="icon" type="image/png" href="/assets/logo_icon.png">
  <!-- Fonte Montserrat via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="cadast_med.js"></script>
</head>
<body>


  <!-- Logo no canto superior esquerdo -->
  <header class="header-logo">
      <img src="/assets/logo.png" class="head-logo" alt="logo">
  </header>

  <!-- Card do Formulário Centralizado -->
  <main class="form-card">
    
    <!-- Cabeçalho -->
    <div class="form-header">
      <h1 class="form-title">Cadastro Médico</h1>
      <p class="form-subtitle">Junte-se à nossa rede de profissionais da saúde</p>
    </div>

    <!-- Formulário -->
    <form class="signup-form" action="/home/home.html" method="POST">

      <!-- Linha 1: Nome e Sobrenome (Agrupamento por Proximidade) -->
      <div class="input-row">
        <div class="input-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Dr(a). Seu nome" required />
        </div>

        <div class="input-group">
          <label for="sobrenome">Sobrenome</label>
          <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome" required />
        </div>
      </div>

      <!-- Linha 2: CRM e CPF (Documentos Profissionais e Pessoais) -->
      <div class="input-row">
        <div class="input-group">
          <label for="crm">CRM / UF</label>
          <input type="text" id="crm" name="crm" placeholder="000000-UF" maxlength="9" oninput="formatarCRM()" required />
        </div>

        <div class="input-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" oninput="formatarCPF()" required />
        </div>
      </div>

      <!-- Linha 3: E-mail -->
      <div class="input-group">
        <label for="email">E-mail Profissional</label>
        <input type="email" id="email" name="email" placeholder="medico@exemplo.com" required />
      </div>

      <!-- Linha 4: Formação / Especialidade -->
      <div class="input-group">
        <label for="formacao">Formação / Especialidade</label>
        <div class="select-wrapper">
          <select id="formacao" name="formacao" required>
            <option value="" disabled selected>Selecione sua especialidade</option>
            <option value="clinica-geral">Clínica Geral</option>
            <option value="cardiologia">Cardiologia</option>
            <option value="pediatria">Pediatria</option>
            <option value="dermatologia">Dermatologia</option>
            <option value="ortopedia">Ortopedia</option>
            <option value="ginecologia">Ginecologia e Obstetrícia</option>
            <option value="outra">Outra Formação/Especialidade</option>
          </select>
        </div>
      </div>

      <!-- Linha 5: Senha -->
      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha de acesso" required />
      </div>

      <!-- Botão de Ação -->
      <div class="form-footer">
        <button type="submit" class="btn-submit">
          <span>Finalizar Cadastro</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

      <div class="login-link">
        Já possui cadastro profissional? <a href="/login/login_med.html">Fazer Login</a>
      </div>

    </form>
  </main>

</body>
</html>
