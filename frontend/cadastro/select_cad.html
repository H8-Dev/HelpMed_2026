<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpMed - Escolha seu Perfil</title>
  <link rel="stylesheet" href="select.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>


  <!-- Conteúdo Principal -->
  <main class="container">
    
    <!-- Logo e Marca -->
    <div class="logo-container">
      <img src="/assets/logo.png" alt="logo">
    </div>

    <!-- Título de Instrução -->
    <h2 class="section-title">Como deseja se cadastrar?</h2>
    <p class="section-description">Escolha a opção que melhor define o seu acesso</p>

    <!-- Cards de Seleção (Princípio da Semelhança e Região Comum) -->
    <div class="cards-grid">
      
      <!-- Opção Paciente -->
      <a href="cadastro_paciente.html" class="profile-card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <h3 class="card-title">Sou Paciente</h3>
        <p class="card-text">Quero agendar consultas e acompanhar meus cuidados de saúde.</p>
        <div class="btn-action">
          <span>Cadastrar como Paciente</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

      <!-- Opção Médico -->
      <a href="cadastro_medico.html" class="profile-card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
            <line x1="4" y1="22" x2="4" y2="15"></line>
            <!-- Ícone de Estetoscópio/Saúde -->
            <path d="M16 4h2a2 2 0 0 1 2 2v7a6 6 0 0 1-6 6 6 6 0 0 1-6-6V6a2 2 0 0 1 2-2h2"></path>
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
          </svg>
        </div>
        <h3 class="card-title">Sou Médico</h3>
        <p class="card-text">Quero oferecer atendimentos e gerenciar meus pacientes.</p>
        <div class="btn-action">
          <span>Cadastrar como Médico</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
      </a>

    </div>

    <!-- Link de Voltar/Login -->
    <div class="footer-link">
      Já possui uma conta? <a href="index.html">Fazer Login</a>
    </div>

  </main>

</body>
</html>
