<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpMed - Cadastro</title>
  <link rel="stylesheet" href="cadastro.css" />
  <!-- Fonte Montserrat via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>


  <!-- Logo isolada no canto superior esquerdo (conforme wireframe) -->
  <header class="header-logo">
    <a href="#" class="logo-link">
        <img src="/assets/logo.png" alt="logo">
    </a>
  </header>

  <!-- Card do Formulário Centralizado (Princípio de Figura/Fundo e Região Comum) -->
  <main class="form-card">
    
    <!-- Cabeçalho com Título e Subtítulo (Ondas do wireframe) -->
    <div class="form-header">
      <h1 class="form-title">Criar Sua Conta</h1>
      <p class="form-subtitle">Preencha seus dados para começar a usar</p>
    </div>

    <!-- Formulário de Cadastro -->
    <form class="signup-form" action="#" method="POST">

        
        <!-- Campo CPF (Princípio de Semelhança) -->
        <div class="input-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required />
        </div>

        <!-- Linha Agrupada (Princípio de Proximidade: Nome e Sobrenome) -->
        <div class="input-row">
          <div class="input-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
          </div>
  
          <div class="input-group">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome" required />
          </div>
        </div>
        
      <!-- Campo E-mail -->
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required />
      </div>

      <!-- Campo Senha -->
      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite uma senha forte" required />
      </div>

      <!-- Botão de Cadastro (Destaque conforme wireframe na parte inferior) -->
      <div class="form-footer">
        <button type="submit" class="btn-submit">
          <span>Cadastrar</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

      <div class="login-link">
        Já tem uma conta? <a href="#">Fazer Login</a>
      </div>

    </form>
  </main>

</body>
</html>
