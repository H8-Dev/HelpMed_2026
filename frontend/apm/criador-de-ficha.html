<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpMed - Criador de Ficha de Exame</title>
  <link rel="stylesheet" href="criador-ficha.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- BARRA LATERAL (SIDEBAR) -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="#" class="sidebar-logo">
        <img src="logo.png" alt="logo">
      </a>

      <nav class="sidebar-menu">
        <a href="#" class="nav-item" title="Mensagens">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </a>
        <a href="#" class="nav-item active" title="Prontuários / Fichas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </a>
        <a href="#" class="nav-item" title="Agenda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </a>
        <a href="#" class="nav-item" title="APM">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
            <path d="M12 12L2.5 7.5"></path>
            <path d="M12 12v10"></path>
          </svg>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <div class="user-avatar" title="Perfil">M</div>
    </div>
  </aside>

  <!-- ESTRUTURA PRINCIPAL -->
  <div class="app-container">
    
    <!-- BARRA SUPERIOR DE AÇÕES -->
    <header class="top-bar">
      <div class="file-info">
        <span class="file-name">Nome do arquivo</span>
      </div>
      <div class="top-actions">
        <button class="action-btn" title="Editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
        <button class="action-btn" title="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
        <button class="action-btn" title="Pasta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></button>
        <button class="action-btn" title="Salvar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
        <button class="action-btn" title="Mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
      </div>
    </header>

    <main class="main-layout">
      <!-- CONTAINER DO FORMULÁRIO DE EXAME -->
      <section class="exam-card">
        
        <h2 class="card-title">Criador de ficha de exame:</h2>

        <!-- SEÇÃO 1: ADICIONAR LINHAS / EXAMES -->
        <div class="form-section">
          <label class="section-label">Adicione a seguir as linhas:</label>
          <input type="text" class="input-line" placeholder="Digite para adicionar..." />

          <div class="tags-group">
            <button class="tag-pill active">Glicose</button>
            <button class="tag-pill active">Colesterol</button>
            <button class="tag-pill active">Cortisol</button>
            <button class="tag-pill active">Testosterona</button>
          </div>
        </div>

        <!-- SEÇÃO 2: TEMPO DE ACOMPANHAMENTO -->
        <div class="form-section">
          <label class="section-label">Selecione nas opções meio de acompanhamento:</label>

          <div class="tags-group">
            <button class="tag-pill">3 Meses</button>
            <button class="tag-pill">6 Meses</button>
            <button class="tag-pill active">1 Ano</button>
            <button class="tag-pill">2 Anos</button>
            <button class="tag-pill">5 Anos</button>
            <button class="tag-pill">Outro</button>
          </div>
        </div>

      </section>
    </main>

  </div>

</body>
</html>
