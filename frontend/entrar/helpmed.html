<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpMed - Bem Vindo de Volta!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" href="/assets/logo_icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="entrar.css">
</head>
<body>

  <div class="bg-shape shape-top-left"></div>
  <div class="bg-shape shape-top-right"></div>
  <div class="bg-shape shape-bottom-left"></div>
  <div class="bg-shape shape-bottom-right"></div>

  <main class="container">
    
    <div class="logo-container">
      <img class="logo-icon" src="/assets/logo.png" alt="logo">
      

    <h2 class="welcome-title">Bem Vindo de Volta!</h2>

    <div class="buttons-group">
      <a href="/login/select_ent.html" class="btn">
        <span>Entrar</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <a href="/cadastro/select_cad.html" class="btn">
        <span>Cadastrar</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

  </main>

</body>
</html>
